<article class="w-full">
  <article class="w-full flex flex-col items-center">
    <section class="divider divider-info divider-end my-15 w-full">
      <h3
        class="text-center text-3xl font-bold bg-linear-to-r from-yellow-400 to-red-700 bg-clip-text text-transparent"
      >
        Películas y Series
      </h3>
    </section>

    <section class="carousel w-[65%] max-w-sm md:max-w-2xl mx-auto rounded-box shadow-2xl">
      @for (movie of movies; track $index) {
        <div id="slide-{{ movie.id }}" class="carousel-item relative w-full aspect-2/3">
          <figure class="h-100 aspect-9/16 overflow-hidden">
            <img
              [ngSrc]="movie.src"
              [alt]="movie.alt"
              [priority]="$index === 0"
              fill
              class="w-full h-full object-cover"
            />
          </figure>

          <div
            class="absolute left-5 right-5 top-1/2 flex -translate-y-1/2 transform justify-between"
          >
            @if (movie.id === 1) {
              <a href="#slide-9" class="btn btn-circle btn-md bg-cyan-700">❮</a>
            } @else {
              <a href="#slide-{{ movie.id - 1 }}" class="btn btn-circle btn-md bg-cyan-700">❮</a>
            }

            @if (movie.id === 9) {
              <a href="#slide-1" class="btn btn-circle btn-md bg-cyan-700">❯</a>
            } @else {
              <a href="#slide-{{ movie.id + 1 }}" class="btn btn-circle btn-md bg-cyan-700">❯</a>
            }
          </div>
        </div>
      }
    </section>
  </article>
</article>
